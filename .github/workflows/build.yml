name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only used on main, to publish the image the VPS pulls
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles every module and runs all tests, including the Postgres ones (Testcontainers uses the runner's Docker)
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Build the Docker image
        run: docker build -t bloom:ci .
      - name: Publish the image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${{ github.sha }}" latest; do
            docker tag bloom:ci "ghcr.io/doppio-lab/bloom:$tag"
            docker push "ghcr.io/doppio-lab/bloom:$tag"
          done
